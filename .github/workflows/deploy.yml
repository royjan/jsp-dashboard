name: Build & Push to ECR

# Auto-deploy ONLY on main. Feature branches never build/push.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write   # required for OIDC -> AWS
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 224072612352.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: jan-parts-dashboard
  CA_DOMAIN: jan-parts
  CA_OWNER: "224072612352"
  CA_REPO: jan-npm

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::224072612352:role/github-actions-ci
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build CodeArtifact .npmrc (private @jan packages)
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "$CA_DOMAIN" --domain-owner "$CA_OWNER" \
            --region "$AWS_REGION" --query authorizationToken --output text)
          echo "::add-mask::$TOKEN"
          REG="//${CA_DOMAIN}-${CA_OWNER}.d.codeartifact.${AWS_REGION}.amazonaws.com/npm/${CA_REPO}/"
          {
            echo "@jan:registry=https:${REG}"
            echo "${REG}:_authToken=${TOKEN}"
            echo "${REG}:always-auth=true"
          } > "$RUNNER_TEMP/npmrc"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          secret-files: |
            npmrc=${{ runner.temp }}/npmrc
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy trigger -> later, over Tailscale. For now click "Deploy" in Dokploy.
